# Loopback-only development overrides; edge/frontend are not enabled in this mode.
services:
  postgres:
    networks: [data, dev_access]
    ports:
      - "127.0.0.1:${DEV_DB_PORT:?}:5432"
  backend:
    networks: [application, data, dev_access]
    ports:
      - "127.0.0.1:${DEV_BACKEND_PORT:?}:8080"

# A gateway network is required for Docker to publish the loopback-only dev ports.
networks:
  dev_access:
