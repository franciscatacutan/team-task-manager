services:
  postgres:
    image: postgres:17
    profiles: [bundled-postgres]

    container_name: team-task-manager-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - team-task-manager-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: team-task-manager-backend

    env_file:
      - .env

    ports:
      - "127.0.0.1:8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8080/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    depends_on:
      postgres:
        condition: service_healthy
        required: false

    restart: unless-stopped

    networks:
      - team-task-manager-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: team-task-manager-frontend

    ports:
      - "127.0.0.1:5173:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - team-task-manager-network

volumes:
  postgres_data:

networks:
  team-task-manager-network:
