services:
  postgres:
    image: postgres:17

    container_name: team-task-manager-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

    networks:
      - team-task-manager-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: team-task-manager-backend

    env_file:
      - .env

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://localhost:8080/actuator/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - team-task-manager-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: team-task-manager-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - team-task-manager-network

volumes:
  postgres_data:

networks:
  team-task-manager-network:
